name: flutter_liquid_glass_tab_bar
description: >-
  Liquid-glass bottom tab bar for Flutter: refractive Impeller shader with a
  non-Impeller fallback, drag-to-select lens, scroll-driven dock/split morph
  and a card slot. RTL and accessibility aware.
version: 0.1.0
repository: https://github.com/bilalelsayed97/flutter_liquid_glass_tab_bar
issue_tracker: https://github.com/bilalelsayed97/flutter_liquid_glass_tab_bar/issues
homepage: https://github.com/bilalelsayed97/flutter_liquid_glass_tab_bar
topics:
  - tab-bar
  - bottom-navigation
  - liquid-glass
  - shader
  - ios

environment:
  sdk: ^3.12.0
  # 3.47 is the floor on purpose. Since Flutter 3.46 Impeller stores
  # render-to-texture backdrops top-down on Metal, Vulkan and OpenGL ES alike,
  # which is what shaders/liquid_glass.frag samples against. Older engines
  # still flip the backdrop on Android GLES (flutter/flutter#186554), so the
  # refraction would show the mirrored half of the screen there.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # ShaderBuilder caches the FragmentProgram behind the glass surface.
  flutter_shaders: ^0.1.3
  # Continuous (squircle) corners for the pills and the split bar outline.
  figma_squircle: ^0.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  shaders:
    - shaders/liquid_glass.frag
